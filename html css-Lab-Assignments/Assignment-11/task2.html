<!DOCTYPE html>
<html>
<head>
    <title>CSS Variables</title>

    <style>
        :root {
            --main-color: #1d3557;
            --accent-color: #e63946;
            --page-padding: 20px;
        }

        body {
            color: var(--main-color);
            padding: var(--page-padding);
        }

        h1 {
            color: var(--accent-color);
        }
    </style>

</head>
<body>

    <h1>Welcome to My Website</h1>

    <p>
        I am learning CSS variables.
        They help us manage colours and spacing easily.
    </p>

</body>
</html>
