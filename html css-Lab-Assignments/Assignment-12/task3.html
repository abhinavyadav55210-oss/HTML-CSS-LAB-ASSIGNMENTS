<!DOCTYPE html>
<html>
<head>
    <title>CSS Scrolling Box</title>

    <style>
        .scroll-box {
            height: 120px;
            width: 300px;
            overflow: auto;
            border: 2px solid black;
            padding: 10px;
            background-color: lightblue;
        }
    </style>

</head>
<body>

    <h1>Scrolling Box Example</h1>

    <div class="scroll-box">

        <p>Line 1: Welcome to HTML and CSS.</p>

        <p>Line 2: I am learning web development.</p>

        <p>Line 3: CSS makes websites attractive.</p>

        <p>Line 4: Scrolling helps display extra content.</p>

        <p>Line 5: Thank you for visiting my page.</p>

    </div>

</body>
</html>
